; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting

;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; WiFi + Bluetooth together need more room than the default 1.3 MB for the
; program, so use the 3 MB layout (it drops over-the-air updates, which
; aren't used)
board_build.partitions = huge_app.csv
monitor_filters = direct
monitor_echo = yes
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    h2zero/NimBLE-Arduino@^2.5.1
    madhephaestus/ESP32Servo@^3.0.6

; One environment per real board for a network demo. Pick one in the
; PlatformIO bar at the bottom of VS Code ("env:..."), then Upload. Each board
; gets its own id, distance down the river and sensors; the boards find each
; other over ESP-NOW. Every board needs the same src/secrets.h (same hotspot).
; The nodes are 100 m apart, so pouring into the next cup 30-90 s later
; gives a believable water speed (1-3 m/s).
[env:node_N1_full]
extends = env:esp32dev
build_flags = -DSIMULATE=0 -DSIM_REMOTE_NODES=0 -DNODE_ID=\"N1\" -DNODE_DISTANCE_M=100
    -DNODE_PLACE=\"middle\"

[env:node_N0_turbidity]
extends = env:esp32dev
build_flags = -DSIMULATE=0 -DSIM_REMOTE_NODES=0 -DNODE_ID=\"N0\" -DNODE_DISTANCE_M=0
    -DNODE_PLACE=\"upstream\" -DHAS_PH=0 -DHAS_TDS=0 -DHAS_TEMP=0

[env:node_N2_turbidity]
extends = env:esp32dev
build_flags = -DSIMULATE=0 -DSIM_REMOTE_NODES=0 -DNODE_ID=\"N2\" -DNODE_DISTANCE_M=200
    -DNODE_PLACE=\"downstream\" -DHAS_PH=0 -DHAS_TDS=0 -DHAS_TEMP=0

; PC unit tests for the pure logic: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<types.cpp> +<labels.cpp> +<compensation.cpp> +<baseline.cpp> +<rules.cpp> +<persistence.cpp> +<node_engine.cpp> +<network.cpp> +<sim.cpp> +<water_speed.cpp> +<report_text.cpp> +<phone_messages.cpp> +<phone_alerts.cpp> +<wifi_alerts.cpp> +<saved_settings.cpp> +<node_link.cpp>
build_flags = -DDEMO_MODE=1 -DDEMO_ALERTS=0 -DMINUTE_MS=60000 -Wall
