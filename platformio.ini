; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting

;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; WiFi + Bluetooth together need more room than the default 1.3 MB for the
; program, so use the 3 MB layout (it drops over-the-air updates, which
; aren't used)
board_build.partitions = huge_app.csv
monitor_filters = direct
monitor_echo = yes
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    h2zero/NimBLE-Arduino@^2.5.1
    madhephaestus/ESP32Servo@^3.0.6

; PC unit tests for the pure logic: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<types.cpp> +<labels.cpp> +<compensation.cpp> +<baseline.cpp> +<rules.cpp> +<persistence.cpp> +<node_engine.cpp> +<network.cpp> +<sim.cpp> +<water_speed.cpp> +<report_text.cpp> +<phone_messages.cpp> +<phone_alerts.cpp> +<wifi_alerts.cpp> +<saved_settings.cpp>
build_flags = -DDEMO_MODE=1 -Wall
