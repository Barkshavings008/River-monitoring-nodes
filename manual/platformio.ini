; Manual version of the river node: helper files only, you write the logic in main.cpp.
; Open this "manual" folder in VS Code / PlatformIO as its own project.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
